<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROBLEME 1</title>
    <style>
      
      body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

h1 {
    text-align: center;
}

#calculator {
    width: 300px;
    margin: 50px auto;
    padding: 20px;
    border: 2px solid #000;
    border-radius: 10px;
    background-color: #ececec;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

#calcDisplay {
    width: 100%;
    height: 60px;
    padding: 20px;
    font-size: 24px;
    text-align: right;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: #fff;
    margin-bottom: 10px;
    box-sizing: border-box; 
}

#buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 60px;
    font-size: 20px;
    border: none;
    border-radius: 5px;
    background-color: green;
    color: #333;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.2s ease;
}

button:hover {
    background-color: #e0e0e0;
}


button.operateur {
    background-color:blue;
    color: #fff;
}

button.clear {
    background-color: #f44336;
    color: #fff;
}

button.clear:hover {
    background-color: #da190b;
}

button.egal {
    background-color: #4caf50;
    color: #fff;
}

button.egal:hover {
    background-color: #388e3c;
}

    </style>
</head>
<body>
    
    <div id="calculator">
        <input type="text" id="calcDisplay">
        <div id="buttons">
            <button class="operateur" value="(">(</button>
            <button class="operateur" value=")">)</button>
            <button class="operateur" value="DEL">DEL</button>
            <button class="clear" value="C">C</button>
            <button value="7">7</button>
            <button value="8">8</button>
            <button value="9">9</button>
            <button class="operateur" value="/">/</button>
            <button value="4">4</button>
            <button value="5">5</button>
            <button value="6">6</button>
            <button class="operateur" value="*">*</button>
            <button value="1">1</button>
            <button value="2">2</button>
            <button value="3">3</button>
            <button class="operateur" value="-">-</button>
            <button  value="0">0</button>
            <button value=".">.</button>
            <button class="operateur egal" value="=">=</button>
            <button class="operateur"  value="+">+</button>
        </div>
    </div>
    
    
    
<script src="calculatrice.js"></script>
    
</body>
</html>
